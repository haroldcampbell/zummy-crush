<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rotate and Match (I002)</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main class="shell">
			<header class="hud">
				<div>
					<h1>Rotate and Match</h1>
					<p>Drag a row or column to rotate, then release to snap.</p>
				</div>
				<div class="hud-item">
					<span class="hud-label">Score</span>
				</div>
				<div class="hud-actions">
					<button id="reset" type="button">Reset</button>
					<button id="export-state" type="button" hidden>Export State</button>
				</div>
			</header>
			<section class="board-panel">
				<div class="score-container"><span id="score-value" class="hud-value">0</span></div>
				<canvas id="board" width="360" height="360"></canvas>
			</section>
			<footer class="footnote">
				<span id="status">Ready</span>
			</footer>
			<button id="help-button" class="help-button" type="button">Info</button>
			<div id="help-modal" class="help-modal" hidden>
				<div class="help-backdrop" data-close="true"></div>
				<div class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
					<header class="help-header">
						<h2 id="help-title">Scoring Guide</h2>
						<button id="help-close" class="help-close" type="button" aria-label="Close">
							✕
						</button>
					</header>
					<div id="help-content" class="help-content"></div>
				</div>
			</div>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
